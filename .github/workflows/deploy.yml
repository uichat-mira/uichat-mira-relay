name: Relay CI / Deploy

on:
  push:
    branches:
      - 'feat/**'
      - dev
      - test
      - prod
  pull_request:
    branches:
      - dev
      - test
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: verify
    if: github.event_name != 'pull_request' && contains(fromJSON('["dev","test","prod"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Prepare environment config
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            dev)
              worker_name="uichat-mira-relay-dev"
              ;;
            test)
              worker_name="uichat-mira-relay-test"
              ;;
            prod)
              worker_name="uichat-mira-relay"
              ;;
            *)
              echo "Unsupported deploy branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

          if [ "${GITHUB_REF_NAME}" = "prod" ]; then
            echo "WRANGLER_CONFIG=wrangler.jsonc" >> "$GITHUB_ENV"
            echo "WORKER_NAME=${worker_name}" >> "$GITHUB_ENV"
            exit 0
          fi

          WORKER_NAME="${worker_name}" node <<'NODE'
          const fs = require('node:fs');

          const source = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          source.name = process.env.WORKER_NAME;
          source.workers_dev = true;
          source.routes = [];

          fs.writeFileSync(
            'wrangler.environment.jsonc',
            JSON.stringify(source, null, 2) + '\n',
          );
          NODE

          echo "WRANGLER_CONFIG=wrangler.environment.jsonc" >> "$GITHUB_ENV"
          echo "WORKER_NAME=${worker_name}" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy -c "$WRANGLER_CONFIG"

      - name: Verify production health
        if: github.ref_name == 'prod'
        shell: bash
        run: |
          set -euo pipefail

          curl             --fail             --silent             --show-error             --retry 10             --retry-delay 2             --retry-all-errors             --max-time 15             https://relay.tomz.io/health             --output /tmp/relay-health.json

          cat /tmp/relay-health.json

          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/relay-health.json", "utf8"));
            if (body.ok !== true || body.service !== "mira-remote-relay" || body.protocolVersion !== 1) {
              console.error("Unexpected Relay health response:", body);
              process.exit(1);
            }
          '

      - name: Show deployed versions
        shell: bash
        run: npx wrangler deployments list -c "$WRANGLER_CONFIG"
